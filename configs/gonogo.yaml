experiment:
  name: gonogo
  description: Go/No-Go task EEG analysis
events:
  ready: 48
  set: 49
  go_stimulus: 50
  nogo_stimulus: 51
  correct_response: 52
  false_alarm: 53
  missed_go_response: 54
  stimulus: 51
  error_response: 53
  missed_response: 54
preprocessing:
  filtering:
    ica:
      l_freq: 1.0
      h_freq: 100.0
    analysis:
      l_freq: 0.05
      h_freq: 30.0
  notch_filter:
    enabled: true
    frequency: 50.0
  ica:
    enabled: true
    method: picard
    n_components: 10
    random_state: 97
    fit_params:
      ortho: false
      extended: true
  iclabel:
    enabled: true
    method: iclabel
    exclude_non_brain: false
    exclude_mode: known_artifacts_only
    keep_labels:
    - brain
    - other
    exclude_labels:
    - eye
    - eye blink
    - eye movement
    - muscle
    - muscle artifact
    - heart
    - heart beat
    - line noise
    - channel noise
    min_exclusion_probability: 0.9
epochs:
  stimulus_locked:
    event: stimulus
    tmin: -0.2
    tmax: 1.3
    baseline:
      start: -0.2
      end: 0.0
  response_locked:
    events:
    - correct_response
    - error_response
    tmin: -0.8
    tmax: 0.5
    baseline:
      start: -0.8
      end: -0.6
behavior:
  reaction_time:
    start_event: go_stimulus
    end_event: correct_response
    min_ms: 100
    max_ms: 1500
  accuracy:
    formula: go_nogo_balanced
    go_stimulus_event: go_stimulus
    nogo_stimulus_event: nogo_stimulus
    correct_go_response_event: correct_response
    false_alarm_event: false_alarm
    missed_go_response_event: missed_go_response
erp_components:
  n2:
    condition: stimulus
    window:
      start: 0.2
      end: 0.35
    roi:
    - F3
    - F4
    - FC5
    - FC6
    sensitivity_rois:
      left_frontocentral:
      - F3
      - FC5
    method: peak
    polarity: negative
  p3:
    condition: stimulus
    window:
      start: 0.3
      end: 0.6
    roi:
    - P7
    - P8
    - O1
    - O2
    sensitivity_rois:
      left_frontocentral:
      - F3
      - FC5
    method: peak
    polarity: positive
response_locked:
  rp:
    condition: correct_response
    window:
      start: -0.5
      end: 0.0
    roi:
    - F3
    - F4
    - FC5
    - FC6
    sensitivity_rois:
      left_frontocentral:
      - F3
      - FC5
    peak_polarity: negative
  pmp:
    condition: correct_response
    window:
      start: 0.15
      end: 0.35
    roi:
    - F3
    - F4
    - FC5
    - FC6
    sensitivity_rois:
      left_frontocentral:
      - F3
      - FC5
    peak_polarity: positive
connectivity:
  methods:
  - coh
  - wpli
  - ciplv
  mode: multitaper
  faverage: true
  fisher_z: false
  time_window:
    start: 0.0
    end: 1.25
  frequency_bands:
    theta:
      fmin: 4.0
      fmax: 8.0
    alpha:
      fmin: 8.0
      fmax: 13.0
    beta:
      fmin: 13.0
      fmax: 30.0
  pairs:
    interhemispheric:
    - source: F3
      target: F4
    intrahemispheric_left:
    - source: F3
      target: P7
    intrahemispheric_right:
    - source: F4
      target: P8
quality_control:
  reject_criteria:
    eeg_uv: 150.0
  minimum_trials:
    stimulus_locked: 10
    response_locked: 10
    connectivity: 10
